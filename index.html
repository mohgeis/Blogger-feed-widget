<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog feed widget</title>
  <style>
    :root {
      --accent: #0C4466;
      --accent2: #50b090;
      --text: #243942;
      --muted: #3D5A66;
      --bg: #f7fafb;
      --card: #ffffff;
      --line: rgba(12, 68, 102, 0.12);
      --cols: 2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
      background: transparent;
      color: var(--text);
    }
    .feed {
      max-width: 1100px;
      margin: 0 auto;
      padding: 8px;
    }
    .feed-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .feed-head h2 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--accent);
    }
    .feed-head a {
      color: var(--accent2);
      font-weight: 700;
      text-decoration: none;
    }
    .feed-head a:hover { text-decoration: underline; }
    .feed-head.hidden { display: none; }
    .feed-list {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: 14px;
    }
    @media (max-width: 900px) {
      .feed-list { grid-template-columns: repeat(min(2, var(--cols)), minmax(0, 1fr)); }
    }
    @media (max-width: 600px) {
      .feed-list { grid-template-columns: 1fr; }
    }
    .post {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform .15s ease, box-shadow .15s ease;
      min-width: 0;
    }
    .post:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.1);
    }
    .post.stack {
      grid-template-columns: 1fr;
      gap: 0;
    }
    .post-media {
      min-height: 96px;
      background: var(--bg) center/cover no-repeat;
    }
    .post.stack .post-media {
      min-height: 150px;
      width: 100%;
    }
    .post-body { padding: 12px 14px 14px 0; min-width: 0; }
    .post.stack .post-body,
    .post.no-thumb .post-body { padding: 14px 16px; }
    .post-date {
      display: block;
      font-size: 0.78rem;
      color: var(--accent2);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .post-title {
      margin: 0 0 6px;
      font-size: 1rem;
      line-height: 1.35;
      color: var(--accent);
    }
    .post-excerpt {
      margin: 0;
      font-size: 0.9rem;
      line-height: 1.5;
      color: var(--muted);
    }
    .status {
      padding: 18px;
      text-align: center;
      color: var(--muted);
      grid-column: 1 / -1;
    }
    .post.no-thumb { grid-template-columns: 1fr; }
  </style>
</head>
<body>
  <div class="feed">
    <div class="feed-head" id="head">
      <h2 id="heading">Latest posts</h2>
      <a id="more" href="#" target="_blank" rel="noopener">All posts →</a>
    </div>
    <div id="posts" class="feed-list">
      <div class="status">Loading…</div>
    </div>
  </div>

  <script>
    (function () {
      /*
        Reusable Blogger → Google Sites feed widget.

        Configure via URL query params:

          ?blog=https://www.softolite.io
          &cols=2
          &rows=3
          &images=1
          &imageSource=auto
          &title=Senaste%20artiklar
          &more=Alla%20inl%C3%A4gg%20%E2%86%92
          &label=Nyheter
          &accent=%230C4466
          &accent2=%2350b090
          &hideHeader=0

        Total posts shown = cols × rows

        imageSource:
          auto    = body image → featured/og:image (main) → feed thumbnail
          og      = featured/og:image only (main post image)
          content = first image in feed body
          thumb   = Blogger media$thumbnail only

        Examples:
          https://mohgeis.github.io/Blogger-feed-widget/?cols=2&rows=2
          https://mohgeis.github.io/Blogger-feed-widget/?blog=https://other.blogspot.com&cols=3&rows=2&images=0
      */

      var q = new URLSearchParams(location.search);

      function param(name, fallback) {
        var v = q.get(name);
        return v === null || v === "" ? fallback : v;
      }

      function clampInt(value, min, max, fallback) {
        var n = parseInt(value, 10);
        if (isNaN(n)) n = fallback;
        return Math.min(Math.max(n, min), max);
      }

      function parseBool(value, defaultTrue) {
        if (value === null || value === undefined || value === "") return defaultTrue;
        var v = String(value).toLowerCase();
        if (v === "0" || v === "false" || v === "no" || v === "off") return false;
        if (v === "1" || v === "true" || v === "yes" || v === "on") return true;
        return defaultTrue;
      }

      function normalizeBlog(input) {
        var raw = (input || "").trim();
        if (!raw) return "";
        if (!/^https?:\/\//i.test(raw)) raw = "https://" + raw;
        try {
          var u = new URL(raw);
          if (u.pathname.indexOf("/feeds/posts/") !== -1) {
            return u.origin + u.pathname.replace(/\/$/, "");
          }
          return u.origin;
        } catch (e) {
          return "";
        }
      }

      var blog = normalizeBlog(param("blog", "https://www.softolite.io"));
      var cols = clampInt(param("cols", "2"), 1, 4, 2);
      var rows = clampInt(param("rows", "3"), 1, 10, 3);
      // Optional override: max still works; otherwise cols × rows
      var max = q.has("max")
        ? clampInt(param("max", "6"), 1, 40, cols * rows)
        : cols * rows;
      var showImages = parseBool(param("images", "1"), true);
      // auto | og | content | thumb
      var imageSource = String(param("imageSource", "auto")).toLowerCase();
      if (["auto", "og", "content", "thumb"].indexOf(imageSource) === -1) {
        imageSource = "auto";
      }
      var title = param("title", "Senaste artiklar / أحدث المقالات");
      var moreLabel = param("more", "Alla inlägg →");
      var label = param("label", "").replace(/^\/+|\/+$/g, "");
      var hideHeader = parseBool(param("hideHeader", "0"), false);
      var accent = param("accent", "#0C4466");
      var accent2 = param("accent2", "#50b090");
      var excerptLen = clampInt(param("excerpt", "140"), 40, 400, 140);
      var fallbackHome = blog || "https://www.softolite.io";
      var useStackLayout = cols > 1;

      document.documentElement.style.setProperty("--accent", accent);
      document.documentElement.style.setProperty("--accent2", accent2);
      document.documentElement.style.setProperty("--cols", String(cols));
      document.title = title;

      var head = document.getElementById("head");
      var heading = document.getElementById("heading");
      var more = document.getElementById("more");
      var posts = document.getElementById("posts");

      if (hideHeader) head.classList.add("hidden");
      heading.textContent = title;
      more.textContent = moreLabel;
      more.href = fallbackHome + "/";

      if (!blog) {
        posts.innerHTML = '<div class="status">Missing ?blog= URL</div>';
        return;
      }

      var feedPath = blog + "/feeds/posts/default";
      if (label) feedPath += "/-/" + encodeURIComponent(label);
      var feedUrl =
        feedPath +
        "?alt=json-in-script&callback=saRenderFeed&max-results=" +
        max;

      function textOf(node) {
        return node && node.$t ? node.$t : "";
      }

      function postLink(entry) {
        var links = entry.link || [];
        for (var i = 0; i < links.length; i++) {
          if (links[i].rel === "alternate") return links[i].href;
        }
        return fallbackHome + "/";
      }

      function upgradeThumb(url) {
        if (!url) return "";
        // Blogger thumbs often end with =s72-c — request a larger size for cards
        return url.replace(/=s\d+(-[a-z0-9-]+)?$/i, "=s640-c");
      }

      function isSkippableImage(url) {
        if (!url) return true;
        var u = url.toLowerCase();
        return (
          u.indexOf("blogblog.com") !== -1 ||
          u.indexOf("/b16") !== -1 ||
          u.indexOf("favicon") !== -1 ||
          /[=/]s\d{1,2}([-.]|$)/.test(u)
        );
      }

      function firstContentImage(html) {
        if (!html) return "";
        var re = /<img[^>]+src=["']([^"']+)["']/gi;
        var m;
        while ((m = re.exec(html))) {
          if (!isSkippableImage(m[1])) return m[1];
        }
        return "";
      }

      function feedThumb(entry) {
        var thumb = entry["media$thumbnail"] && entry["media$thumbnail"].url;
        return thumb ? upgradeThumb(thumb) : "";
      }

      // Sync best-effort image (feed only). media$thumbnail is often NOT the
      // featured/main image when a post has several pictures.
      function syncEntryImage(entry, html) {
        var contentImg = firstContentImage(html);
        var thumb = feedThumb(entry);
        if (imageSource === "content") return contentImg;
        if (imageSource === "thumb") return thumb;
        if (imageSource === "og") return thumb || contentImg; // placeholder until og loads
        // auto: prefer body image when feed includes HTML (Full), else thumb
        return contentImg || thumb;
      }

      function setCardImage(card, url) {
        if (!card || !url || isSkippableImage(url)) return;
        var media = card.querySelector(".post-media");
        if (!media) {
          media = document.createElement("div");
          media.className = "post-media";
          card.insertBefore(media, card.firstChild);
          card.classList.remove("no-thumb");
          if (useStackLayout) card.classList.add("stack");
        }
        media.style.backgroundImage = 'url("' + url.replace(/"/g, "") + '")';
      }

      // Featured / social main image (og:image) — correct when feed thumb is wrong
      function fetchMainImage(postUrl) {
        var api =
          "https://api.microlink.io?url=" +
          encodeURIComponent(postUrl) +
          "&meta";
        return fetch(api)
          .then(function (r) {
            return r.json();
          })
          .then(function (d) {
            if (
              d &&
              d.status === "success" &&
              d.data &&
              d.data.image &&
              d.data.image.url
            ) {
              return d.data.image.url;
            }
            return "";
          })
          .catch(function () {
            return "";
          });
      }

      function upgradeCardsToMainImages(cards) {
        if (!showImages) return;
        if (imageSource !== "auto" && imageSource !== "og") return;
        cards.forEach(function (card) {
          var href = card.getAttribute("href");
          if (!href) return;
          fetchMainImage(href).then(function (mainUrl) {
            if (mainUrl) setCardImage(card, mainUrl);
          });
        });
      }

      function excerpt(html, maxLen) {
        var tmp = document.createElement("div");
        tmp.innerHTML = html || "";
        var text = (tmp.textContent || tmp.innerText || "").replace(/\s+/g, " ").trim();
        if (text.length <= maxLen) return text;
        return text.slice(0, maxLen).replace(/\s+\S*$/, "") + "…";
      }

      function formatDate(iso) {
        try {
          return new Date(iso).toLocaleDateString("sv-SE", {
            year: "numeric",
            month: "short",
            day: "numeric"
          });
        } catch (e) {
          return "";
        }
      }

      window.saRenderFeed = function (data) {
        var entries = (data && data.feed && data.feed.entry) || [];
        if (!entries.length) {
          posts.innerHTML = '<div class="status">No posts yet.</div>';
          return;
        }

        var feedLink = "";
        var fl = (data.feed && data.feed.link) || [];
        for (var i = 0; i < fl.length; i++) {
          if (fl[i].rel === "alternate") feedLink = fl[i].href;
        }
        if (feedLink) more.href = feedLink;

        // Cap to cols × rows (or max override)
        entries = entries.slice(0, max);

        posts.innerHTML = "";
        var cards = [];
        entries.forEach(function (entry) {
          var html = textOf(entry.content) || textOf(entry.summary);
          var img = showImages ? syncEntryImage(entry, html) : "";
          var href = postLink(entry);
          var postTitle = textOf(entry.title) || "Post";
          var date = formatDate(textOf(entry.published));
          var summary = excerpt(html, excerptLen);

          var a = document.createElement("a");
          var classes = ["post"];
          if (!img) classes.push("no-thumb");
          else if (useStackLayout) classes.push("stack");
          a.className = classes.join(" ");
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener";

          if (img) {
            var media = document.createElement("div");
            media.className = "post-media";
            media.style.backgroundImage = 'url("' + img.replace(/"/g, "") + '")';
            a.appendChild(media);
          }

          var body = document.createElement("div");
          body.className = "post-body";
          body.innerHTML =
            '<span class="post-date"></span>' +
            '<h3 class="post-title"></h3>' +
            '<p class="post-excerpt"></p>';
          body.querySelector(".post-date").textContent = date;
          body.querySelector(".post-title").textContent = postTitle;
          body.querySelector(".post-excerpt").textContent = summary;
          a.appendChild(body);
          posts.appendChild(a);
          cards.push(a);
        });

        // Replace feed thumbnails with the real featured/main image (og:image)
        upgradeCardsToMainImages(cards);
      };

      var s = document.createElement("script");
      s.src = feedUrl;
      s.onerror = function () {
        posts.innerHTML =
          '<div class="status">Could not load feed. Check that the blog is public and Site feed is enabled.</div>';
      };
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
